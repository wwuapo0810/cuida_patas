spring:
  application:
    name: cuidapatas-backend

  datasource:
    # Las tres variables las inyecta docker-compose.yml desde el archivo .env.
    # No hay valores por defecto a propósito: la app debe fallar de inmediato
    # si se intenta arrancar sin configuración, en vez de apuntar a una base equivocada.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # validate, no update: si alguien agrega un @Column sin su migración Flyway,
    # la aplicación falla al arrancar con un mensaje claro en vez de desincronizar
    # la base que comparte todo el equipo.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Muestra el estado del componente de base de datos, que es justamente
      # lo que hay que poder verificar desde fuera del contenedor.
      show-details: always

# ---------------------------------------------------------------------------
# Configuración propia de CuidaPatas
# ---------------------------------------------------------------------------
app:
  jwt:
    # Clave para firmar los tokens. Igual que las credenciales de la base: sin
    # valor por defecto, para que nadie arranque con un secreto conocido.
    # Mínimo 32 bytes (lo valida JwtService al arrancar). Generar con:
    #   openssl rand -base64 48
    secreto: ${JWT_SECRET}
    # 8 horas: cubre una jornada de trabajo sin obligar a reingresar. Como no hay
    # refresh tokens todavía, al vencer hay que volver a iniciar sesión.
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:480}

  cors:
    # Orígenes del navegador autorizados a llamar la API, separados por coma.
    # El valor por defecto es el servidor de desarrollo de Vite; en despliegue se
    # sobreescribe con APP_CORS_ORIGINS.
    origenes-permitidos: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    org.flywaydb: INFO
